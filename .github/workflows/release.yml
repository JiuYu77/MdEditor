# MdEditor 三平台自动打包发布（Linux / Windows / macOS）
# 触发方式：
#   1) 推送形如 v0.1.0 的 git tag（推荐）：git tag v0.1.0 && git push origin v0.1.0
#   2) 在 Actions 页面手动运行（workflow_dispatch）
# 产物：GitHub 自动创建一个 Draft Release；安装包统一重命名为
#   MdEditor-<系统>-<架构>-<版本>.<ext> 后上传。
# macOS 额外处理：DMG 卷图标设置为软件图标（hdiutil + SetFile 后处理）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon（M 系列）
            args: "--target aarch64-apple-darwin"
            upload_files: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: "macos-latest" # Intel Mac
            args: "--target x86_64-apple-darwin"
            upload_files: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: "ubuntu-22.04" # Linux（deb / AppImage / rpm）
            args: ""
            upload_files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: "windows-latest" # Windows（NSIS / MSI）
            args: ""
            upload_files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（Tauri 2 需要 webkit2gtk-4.1）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js（Vite 7 需要 20.19+/22.12+）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（stable，macOS 双架构 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 增量编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖（npm workspaces 含 @mdeditor/* 本地包）
        run: npm install

      # 跨平台取版本号（node 写法在 bash / pwsh 均可用，输出 tag=v0.1.0 与 version=0.1.0）
      - name: 计算版本与 tag
        id: version
        run: node -e "const v=require('./src-tauri/tauri.conf.json').version;require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'tag=v'+v+'\nversion='+v+'\n')"

      # 全部平台关闭自动上传：构建后先重命名、处理 DMG 图标，再统一由 softprops 上传
      - name: 构建安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "MdEditor v__VERSION__"
          releaseBody: "请见下方附件下载对应平台的安装包。\n\n- Windows: .msi / .exe (NSIS)\n- macOS: .dmg / .app\n- Linux: .deb / .AppImage / .rpm"
          releaseDraft: true
          prerelease: false
          uploadReleaseAssets: false

      # macOS 专用：把软件图标挂到 DMG 卷上（Finder 挂载时/文件管理器显示软件图标）
      # 注意：hdiutil convert -o 会自动补 .dmg 后缀，临时文件名显式带 .dmg
      - name: 设置 DMG 卷图标（软件图标）
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          ICNS="src-tauri/icons/icon.icns"
          for DMG in src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -e "$DMG" ] || { echo "未找到 DMG 文件"; exit 1; }
            echo "==> 处理 $DMG"
            RW="${DMG%.dmg}.rw.dmg"
            FINAL="${DMG%.dmg}.final.dmg"
            hdiutil convert "$DMG" -format UDRW -o "$RW"
            VOL=$(hdiutil attach "$RW" -nobrowse | awk -F'\t' '/\/Volumes\// {print $NF; exit}')
            echo "    挂载点: $VOL"
            cp "$ICNS" "$VOL/.VolumeIcon.icns"
            SetFile -a C "$VOL"
            hdiutil detach "$VOL" -quiet
            hdiutil convert "$RW" -format UDZO -o "$FINAL"
            rm -f "$RW"
            mv "$FINAL" "$DMG"
            echo "==> 完成: $DMG"
          done

      # 重命名：文件名带 系统-架构-版本（shell: bash，Windows runner 自带 Git Bash）
      - name: 重命名安装包（系统-架构-版本）
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd src-tauri/target/release/bundle
          case "${{ matrix.platform }}" in
            windows-latest)
              mv nsis/*.exe "nsis/MdEditor-windows-x64-${VERSION}-setup.exe"
              mv msi/*.msi "msi/MdEditor-windows-x64-${VERSION}.msi"
              ;;
            ubuntu-22.04)
              mv deb/*.deb "deb/MdEditor-linux-amd64-${VERSION}.deb"
              mv appimage/*.AppImage "appimage/MdEditor-linux-amd64-${VERSION}.AppImage"
              mv rpm/*.rpm "rpm/MdEditor-linux-x86_64-${VERSION}.rpm"
              ;;
            macos-latest)
              for f in dmg/*.dmg; do
                case "$f" in *aarch64*) ARCH="aarch64" ;; *) ARCH="x86_64" ;; esac
                mv "$f" "dmg/MdEditor-macos-${ARCH}-${VERSION}.dmg"
              done
              # 原始 .app 包（未签名，解压即可运行）也一并打包上传
              if [ -d "macos/MdEditor.app" ]; then
                tar -czf "macos/MdEditor-macos-${ARCH}-${VERSION}.app.tar.gz" -C macos MdEditor.app
              fi
              ;;
          esac

      # 统一上传（release 由 tauri-action 创建，此处仅追加资产）
      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: false
          files: ${{ matrix.upload_files }}
