<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa2ec"/>
      <stop offset="1" stop-color="#005daa"/>
    </linearGradient>
  </defs>
  <!-- 背景：圆角方块，品牌蓝渐变（唯一图形层级，保持极简） -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- 符号：白色粗笔画 M（两竖 + 中间 V，圆头圆角，参考 Typora 式几何标记） -->
  <g fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150 128 V 384"/>
    <path d="M 150 128 L 256 306"/>
    <path d="M 256 306 L 362 128"/>
    <path d="M 362 128 V 384"/>
  </g>
</svg>
