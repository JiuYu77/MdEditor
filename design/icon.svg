<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa2ec"/>
      <stop offset="1" stop-color="#005daa"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- 背景：圆角方块，品牌蓝渐变 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- 顶部高光（玻璃感） -->
  <rect x="16" y="16" width="480" height="196" rx="112" fill="#ffffff" opacity="0.08"/>
  <!-- 软件名 Md：白色超粗体 -->
  <text x="226" y="318" font-family="'Segoe UI','Segoe UI Variable Text',Arial,sans-serif" font-size="272" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-14">Md</text>
  <!-- 编辑光标：Md 右侧竖线（暖黄色与蓝色背景对比，明确"光标"意象） -->
  <rect x="440" y="124" width="20" height="220" rx="10" fill="url(#cursor)"/>
  <!-- 底部 Markdown 语法横线（列表/分隔感） -->
  <g opacity="0.55">
    <rect x="151" y="402" width="210" height="12" rx="6" fill="#ffffff"/>
    <rect x="191" y="428" width="130" height="12" rx="6" fill="#ffffff"/>
  </g>
</svg>
